name: CI

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
      - '.github/ISSUE_TEMPLATE/**'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'

# 같은 브랜치에 새 커밋이 오면 이전 실행을 취소한다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Gradle wrapper 검증
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # main 에서만 캐시를 쓰고, PR 은 읽기만 한다.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: 포맷 검사
        run: ./gradlew spotlessCheck

      - name: 단위 테스트
        run: ./gradlew testDebugUnitTest

      - name: Lint
        run: ./gradlew lintRelease

      - name: 스크린샷 테스트
        run: ./gradlew validateDebugScreenshotTest

      - name: 빌드
        run: ./gradlew assembleDebug assembleRelease

      - name: 리포트 올리기
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/lint-results-*.html
            **/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 7

  instrumented-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Gradle wrapper 검증
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: KVM 사용 허용
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 계측 테스트
        # 하드웨어 렌더링이 없는 러너라 swiftshader 로 그린다.
        # Baseline Profile 수집은 같은 러너에서 돌리면 메모리가 모자라 강제 종료된다.
        # 프로파일은 필요할 때 로컬에서 ./gradlew :app:generateBaselineProfile 로 만든다.
        run: >-
          ./gradlew pixel5Api35Check
          -x :baselineprofile:pixel5Api35NonMinifiedReleaseAndroidTest
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect

      - name: 리포트 올리기
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-test-reports
          path: '**/build/reports/androidTests/**'
          if-no-files-found: ignore
          retention-days: 7
